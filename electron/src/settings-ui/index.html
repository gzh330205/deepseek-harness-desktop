<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>DSH Desktop 设置</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115; --panel: #161a22; --fg: #e8ebf2; --muted: #8d97ab;
      --line: rgba(255,255,255,.10); --field: #0b0d12; --accent: #4c6ef5; --danger: #f07a7a;
    }
    /* Shell chrome follows the OS theme, like the title bar. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f3f3; --panel: #ffffff; --fg: #1f1f1f; --muted: #666e7a;
        --line: rgba(0,0,0,.12); --field: #ffffff; --accent: #3b5bdb; --danger: #c0392b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px 20px 16px;
      background: var(--bg); color: var(--fg);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    p.hint { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    section { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; background: var(--panel); }
    section > h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .3px; }
    .row { display: grid; grid-template-columns: 132px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
    .row:last-child { margin-bottom: 0; }
    label { color: var(--fg); }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 6px 8px; color: var(--fg); background: var(--field);
      border: 1px solid var(--line); border-radius: 6px; font: inherit;
    }
    input[type="number"] { max-width: 120px; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .checks label { display: flex; align-items: center; gap: 6px; }
    .inline-hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    dl { display: grid; grid-template-columns: 132px 1fr; gap: 4px 10px; margin: 0; font-size: 12px; }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; }
    footer { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    #status { flex: 1; font-size: 12px; color: var(--muted); min-height: 18px; }
    #status.error { color: var(--danger); }
    button {
      font: inherit; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
      color: var(--fg); background: transparent; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button[disabled] { opacity: .5; cursor: default; }
    button.small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
    select {
      font: inherit; padding: 5px 6px; color: var(--fg); background: var(--field);
      border: 1px solid var(--line); border-radius: 6px; max-width: 100%;
    }
    code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; word-break: break-all; }
    .pocket { display: grid; grid-template-columns: 152px 1fr; gap: 14px; align-items: start; margin-top: 12px; }
    .pocket[hidden] { display: none; }
    #pocketQr { width: 148px; height: 148px; padding: 4px; background: #fff; border-radius: 8px;
      image-rendering: pixelated; }
    .pocket p { margin: 0 0 8px; }
    .pocket .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pocket .k { color: var(--muted); font-size: 12px; min-width: 56px; }
    .pocket .state { font-size: 12px; color: var(--muted); }
    .pocket .state.error { color: var(--danger); }
  </style>
</head>
<body>
  <h1>桌面端设置</h1>
  <p class="hint">这些设置由桌面壳自己保存，不需要 DSH 页面参与。端口与代理是启动 dsh 时交给它的参数，改动后需要重启桌面端。</p>

  <section>
    <h2>服务</h2>
    <div class="row">
      <label for="port">服务端口</label>
      <input id="port" type="number" min="1024" max="65535" step="1" data-testid="port" />
    </div>
    <p class="inline-hint" id="portHint"></p>
  </section>

  <section>
    <h2>窗口行为</h2>
    <div class="row">
      <label>关闭按钮</label>
      <div class="checks">
        <label><input type="radio" name="close" value="minimizeToTray" data-testid="close-tray" /> 最小化到托盘</label>
        <label><input type="radio" name="close" value="exit" data-testid="close-exit" /> 退出应用</label>
      </div>
    </div>
  </section>

  <section>
    <h2>代理（传给 dsh 子进程）</h2>
    <div class="row">
      <label>启用代理</label>
      <div class="checks"><label><input type="checkbox" id="proxyEnabled" data-testid="proxy-enabled" /> 使用下面的代理</label></div>
    </div>
    <div class="row"><label for="httpProxy">HTTP 代理</label><input id="httpProxy" type="text" placeholder="http://127.0.0.1:7890" /></div>
    <div class="row"><label for="httpsProxy">HTTPS 代理</label><input id="httpsProxy" type="text" placeholder="http://127.0.0.1:7890" /></div>
    <div class="row"><label for="noProxy">不使用代理</label><input id="noProxy" type="text" placeholder="localhost,127.0.0.1" /></div>
  </section>

  <section>
    <h2>侧边栏浏览器</h2>
    <div class="checks">
      <label><input type="checkbox" id="browserEnabled" data-testid="browser-enabled" /> 启用桌面壳自带的侧边栏浏览器（含 agent 网页读取工具）</label>
    </div>
    <p class="hint">关闭后不再向 DSH 注入浏览器工具，侧边栏也不再出现「浏览器」；重新打开需要重载 DSH 界面（保存并重启最直接）。</p>
  </section>

  <section>
    <h2>手机访问（局域网）</h2>
    <div class="row">
      <label>允许手机访问</label>
      <div class="checks"><label><input type="checkbox" id="pocketEnabled" data-testid="pocket-enabled" /> 同一 WiFi 下的手机可以打开这台电脑上的 DSH</label></div>
    </div>
    <div class="row">
      <label for="pocketPort">访问端口</label>
      <input id="pocketPort" type="number" min="1024" max="65535" step="1" data-testid="pocket-port" />
    </div>
    <div class="pocket" id="pocketBox" hidden>
      <img id="pocketQr" alt="手机扫码打开" />
      <div>
        <div class="line"><span class="k">地址</span><code id="pocketUrl" data-testid="pocket-url">—</code></div>
        <div class="line">
          <span class="k">密码</span><code id="pocketPassword" data-testid="pocket-password">—</code>
          <button type="button" class="small" id="pocketRotate" data-testid="pocket-rotate">刷新</button>
          <button type="button" class="small" id="pocketCustom" data-testid="pocket-custom">自定义</button>
        </div>
        <div class="line">
          <span class="k">本机地址</span>
          <select id="pocketAddress" data-testid="pocket-address"></select>
        </div>
        <p class="state" id="pocketState" data-testid="pocket-state"></p>
      </div>
    </div>
    <p class="hint" id="pocketHint"></p>
  </section>

  <section>
    <h2>手机访问（公网）</h2>
    <p class="hint">
      不在同一 WiFi 时用这条通道：流量经 Cloudflare 隧道，公网地址不会直接暴露你的电脑。
      公网访问要密码，且<strong>每次开启都要重新确认</strong>；用完请关闭。
    </p>
    <div class="row">
      <label>隧道方式</label>
      <div class="checks">
        <label><input type="radio" name="pocketTunnelMode" value="quick" data-testid="tunnel-mode-quick" /> 快速隧道（每次一个随机地址，最省事）</label>
        <label><input type="radio" name="pocketTunnelMode" value="named" data-testid="tunnel-mode-named" /> 命名隧道（固定域名，需要自己的域名与 Tunnel Token）</label>
      </div>
    </div>
    <div class="row">
      <label for="pocketTunnelPort">本地转发端口</label>
      <input id="pocketTunnelPort" type="number" min="1024" max="65535" step="1" data-testid="pocket-tunnel-port" />
    </div>
    <div id="pocketNamedBox" hidden>
      <div class="row">
        <label for="pocketTunnelDomain">公网域名</label>
        <input id="pocketTunnelDomain" type="text" placeholder="pocket.example.com" data-testid="pocket-tunnel-domain" />
      </div>
      <div class="row">
        <label for="pocketTunnelToken">Tunnel Token</label>
        <input id="pocketTunnelToken" type="password" placeholder="只保存在本机，不写入设置文件" data-testid="pocket-tunnel-token" />
      </div>
    </div>
    <div class="row">
      <label>公网访问</label>
      <div class="checks">
        <button type="button" id="pocketTunnelStart" data-testid="pocket-tunnel-start">开启公网访问</button>
        <button type="button" id="pocketTunnelStop" data-testid="pocket-tunnel-stop">关闭公网访问</button>
      </div>
    </div>
    <div class="pocket" id="pocketTunnelBox" hidden>
      <img id="pocketTunnelQr" alt="手机扫码打开公网地址" />
      <div>
        <div class="line"><span class="k">公网地址</span><code id="pocketTunnelUrl" data-testid="pocket-tunnel-url">—</code></div>
        <div class="line">
          <span class="k">公网密码</span><code id="pocketTunnelPassword" data-testid="pocket-tunnel-password">—</code>
          <button type="button" class="small" id="pocketTunnelRotate" data-testid="pocket-tunnel-rotate">刷新</button>
          <button type="button" class="small" id="pocketTunnelCustom" data-testid="pocket-tunnel-custom">自定义</button>
        </div>
        <p class="state" id="pocketTunnelState" data-testid="pocket-tunnel-state"></p>
      </div>
    </div>
    <p class="hint" id="pocketTunnelHint"></p>
  </section>

  <section>
    <h2>更新检查</h2>
    <div class="checks">
      <label><input type="checkbox" id="checkDesktopOnStart" data-testid="check-desktop" /> 启动时检查桌面端更新</label>
      <label><input type="checkbox" id="checkDshOnStart" /> 启动时检查 DSH 更新</label>
    </div>
  </section>

  <section>
    <h2>当前状态</h2>
    <dl id="facts"></dl>
  </section>

  <footer>
    <span id="status" data-testid="status"></span>
    <button type="button" id="restart" data-testid="save-restart">保存并重启</button>
    <button type="button" id="close">关闭</button>
    <button type="button" class="primary" id="save" data-testid="save">保存</button>
  </footer>

  <script>
    const api = window.__DSH_SETTINGS__
    const statusEl = document.getElementById('status')
    const factsEl = document.getElementById('facts')
    const portEl = document.getElementById('port')
    const portHintEl = document.getElementById('portHint')
    const proxyEnabledEl = document.getElementById('proxyEnabled')
    const fields = ['httpProxy', 'httpsProxy', 'noProxy'].map((id) => document.getElementById(id))
    const pocketEnabledEl = document.getElementById('pocketEnabled')
    const pocketPortEl = document.getElementById('pocketPort')
    const pocketBoxEl = document.getElementById('pocketBox')
    const pocketQrEl = document.getElementById('pocketQr')
    const pocketUrlEl = document.getElementById('pocketUrl')
    const pocketPasswordEl = document.getElementById('pocketPassword')
    const pocketAddressEl = document.getElementById('pocketAddress')
    const pocketStateEl = document.getElementById('pocketState')
    const pocketHintEl = document.getElementById('pocketHint')
    let snapshot

    function setStatus(message, isError) {
      statusEl.textContent = message
      statusEl.classList.toggle('error', Boolean(isError))
    }

    function fill(state) {
      snapshot = state
      const v = state.values
      portEl.value = String(v.servicePort)
      portEl.placeholder = String(state.facts.defaultPort)
      portHintEl.textContent = '环境变量 DSH_DESKTOP_PORT 优先于这里；留空或超出范围时使用默认端口 '
        + state.facts.defaultPort + '。'
      for (const radio of document.querySelectorAll('input[name="close"]')) {
        radio.checked = radio.value === v.closeBehavior
      }
      proxyEnabledEl.checked = v.proxyEnabled
      document.getElementById('httpProxy').value = v.httpProxy
      document.getElementById('httpsProxy').value = v.httpsProxy
      document.getElementById('noProxy').value = v.noProxy
      document.getElementById('checkDesktopOnStart').checked = v.checkDesktopOnStart
      document.getElementById('checkDshOnStart').checked = v.checkDshOnStart
      document.getElementById('browserEnabled').checked = v.browserEnabled !== false
      pocketEnabledEl.checked = v.pocketEnabled === true
      pocketPortEl.value = String(v.pocketPort)
      pocketPortEl.placeholder = '41730'
      renderPocketAll(state.pocket || {})
      const rows = [
        ['桌面端版本', state.facts.desktopVersion],
        ['随包 DSH', state.facts.runtimeVersion + '（' + state.facts.runtimeSource + '）'],
        ['当前 DSH', state.facts.dshVersion || '未运行'],
        ['实际端口', state.facts.effectivePort === null ? '未启动' : String(state.facts.effectivePort)],
        ['profile', state.facts.profileName],
        ['设置文件', state.facts.settingsPath],
      ]
      factsEl.replaceChildren()
      for (const [key, value] of rows) {
        const dt = document.createElement('dt'); dt.textContent = key
        const dd = document.createElement('dd'); dd.textContent = value
        factsEl.append(dt, dd)
      }
    }

    /** Render the live phone-access state: code, address, password and why it is not running. */
    /** The public section: separate address, separate password, and it can be off while the LAN one is on. */
    function renderPocketTunnel(publicAccess, mode, domain) {
      const box = document.getElementById('pocketTunnelBox')
      const state = document.getElementById('pocketTunnelState')
      const hint = document.getElementById('pocketTunnelHint')
      const named = mode === 'named'
      document.getElementById('pocketNamedBox').hidden = !named
      for (const radio of document.querySelectorAll('input[name="pocketTunnelMode"]')) {
        radio.checked = radio.value === mode
      }
      document.getElementById('pocketTunnelDomain').value = domain || ''
      box.hidden = publicAccess.url === undefined
      document.getElementById('pocketTunnelQr').src = publicAccess.qr || ''
      document.getElementById('pocketTunnelUrl').textContent = publicAccess.url || '—'
      document.getElementById('pocketTunnelPassword').textContent = publicAccess.password || '—'
      state.textContent = publicAccess.error
        ? publicAccess.error
        : publicAccess.running
          ? '正在运行' + (publicAccess.customPassword ? '（密码已固定）' : '（快速隧道每次换密码）')
          : publicAccess.available === false
            ? '这台电脑上没有随包的隧道程序，公网访问不可用'
            : ''
      state.classList.toggle('error', Boolean(publicAccess.error))
      hint.textContent = publicAccess.running
        ? '公网地址已公开在互联网上，虽然要密码，也请用完就关。'
        : named
          ? '命名隧道需要先在 Cloudflare 建好隧道，把公网域名指向 http://127.0.0.1:' + (publicAccess.port || '') + '，再填入域名与 Token。'
          : '开启后会通过 Cloudflare 起一条临时隧道；如果连不上，先关掉本机的代理/VPN（TUN 模式最容易拦隧道）。'
    }

    function renderPocket(pocket) {
      pocketBoxEl.hidden = pocket.url === undefined
      pocketQrEl.src = pocket.qr || ''
      pocketUrlEl.textContent = pocket.url || '—'
      pocketPasswordEl.textContent = pocket.password || '—'
      const candidates = pocket.candidates || []
      if (pocketAddressEl.options.length !== candidates.length + 1) {
        pocketAddressEl.replaceChildren()
        const automatic = document.createElement('option')
        automatic.value = ''
        automatic.textContent = '自动选择'
        pocketAddressEl.append(automatic)
        for (const candidate of candidates) {
          const option = document.createElement('option')
          option.value = candidate.address
          option.textContent = candidate.address + (candidate.virtual ? '（虚拟网卡）' : '') + ' · ' + candidate.name
          pocketAddressEl.append(option)
        }
      }
      pocketAddressEl.value = pocket.selected || ''
      pocketStateEl.textContent = pocket.error
        ? pocket.error
        : pocket.running ? '正在运行' : ''
      pocketStateEl.classList.toggle('error', Boolean(pocket.error))
      pocketHintEl.textContent = pocket.enabled === true
        ? '手机与电脑连同一个 WiFi，扫码后输入密码即可；密码可以随时刷新，刷新后已登录的手机会被登出。'
        : '打开后会在本机另起一个带密码的入口（DSH 自己仍然只监听 127.0.0.1）。关掉开关会立即断开手机。'
    }

    /** Render both halves of phone access from one status answer. */
    function renderPocketAll(pocket) {
      renderPocket(pocket || {})
      const publicAccess = (pocket && pocket.publicAccess) || {}
      renderPocketTunnel(publicAccess, publicAccess.mode || 'quick', publicAccess.domain || '')
    }

    /** Ask main for an action and re-render from the answer it returns. */
    async function pocketAction(action) {
      try {
        const pocket = await api.pocket(action)
        renderPocketAll(pocket)
        if (pocket && pocket.error) setStatus(pocket.error, true)
      } catch (error) {
        setStatus(String(error), true)
      }
    }

    /**
     * The gate in front of the internet.
     *
     * Shown every single time, not once and remembered: what it warns about (this computer runs code
     * for whoever reaches it) does not become less true because the user saw it yesterday.
     */
    async function startPublicAccess() {
      const mode = (document.querySelector('input[name="pocketTunnelMode"]:checked') || {}).value
      const domain = document.getElementById('pocketTunnelDomain').value.trim()
      const token = document.getElementById('pocketTunnelToken').value.trim()
      if (mode === 'named' && token !== '') void pocketAction({ kind: 'setTunnelToken', value: token })
      if (mode === 'named' && domain === '') {
        setStatus('命名隧道要先填公网域名', true)
        return
      }
      const agreed = window.confirm(
        '开启后，互联网上的任何人只要拿到地址和密码，就能操作你这台电脑上的 DSH，'
        + '而 DSH 可以读写文件、执行命令。\n\n'
        + '建议：只在需要时开启，用完立即关闭；不要把这个地址分享给别人。\n\n'
        + '确定要开启公网访问吗？',
      )
      if (!agreed) return
      // Configuration first, so the start uses what the page shows right now.
      await save()
      await pocketAction({ kind: 'startTunnel', acceptedDisclaimer: true })
    }

    function collect() {
      const close = document.querySelector('input[name="close"]:checked')
      return {
        servicePort: portEl.value.trim() === '' ? undefined : Number(portEl.value),
        closeBehavior: close ? close.value : undefined,
        proxyEnabled: proxyEnabledEl.checked,
        httpProxy: fields[0].value,
        httpsProxy: fields[1].value,
        noProxy: fields[2].value,
        checkDesktopOnStart: document.getElementById('checkDesktopOnStart').checked,
        checkDshOnStart: document.getElementById('checkDshOnStart').checked,
        browserEnabled: document.getElementById('browserEnabled').checked,
        pocketEnabled: pocketEnabledEl.checked,
        pocketPort: pocketPortEl.value.trim() === '' ? undefined : Number(pocketPortEl.value),
        // The tunnel's on/off is not part of the form: it needs the disclaimer, so it has its own
        // buttons. Everything else about it is ordinary configuration.
        pocketTunnelPort: document.getElementById('pocketTunnelPort').value.trim() === ''
          ? undefined
          : Number(document.getElementById('pocketTunnelPort').value),
        pocketTunnelMode: (document.querySelector('input[name="pocketTunnelMode"]:checked') || {}).value,
        pocketTunnelDomain: document.getElementById('pocketTunnelDomain').value.trim(),
      }
    }

    async function save() {
      setStatus('正在保存…', false)
      const result = await api.save(collect())
      if (!result.ok) {
        setStatus(result.reason || '保存失败', true)
        return false
      }
      const changed = result.changed || []
      setStatus(changed.length === 0
        ? '没有变化'
        : '已保存：' + changed.join('、') + (result.restartRequired ? '（重启后生效）' : ''), false)
      const fresh = await api.get()
      fill(fresh)
      return true
    }

    if (!api) {
      setStatus('设置页未获得桌面壳 API（preload 未加载）', true)
    } else {
      api.get().then(fill).catch((error) => { setStatus(String(error), true) })
      document.getElementById('save').addEventListener('click', () => { void save() })
      document.getElementById('pocketRotate').addEventListener('click', () => { void pocketAction({ kind: 'rotate' }) })
      document.getElementById('pocketCustom').addEventListener('click', () => {
        const value = window.prompt('输入新的访问密码（8–64 位英文字母或数字）')
        if (value === null) return
        void pocketAction({ kind: 'setPassword', value: value.trim() })
      })
      pocketAddressEl.addEventListener('change', () => {
        void pocketAction({ kind: 'select', address: pocketAddressEl.value })
      })
      document.getElementById('pocketTunnelStart').addEventListener('click', () => { void startPublicAccess() })
      document.getElementById('pocketTunnelStop').addEventListener('click', () => { void pocketAction({ kind: 'stopTunnel' }) })
      document.getElementById('pocketTunnelRotate').addEventListener('click', () => { void pocketAction({ kind: 'rotatePublicPassword' }) })
      document.getElementById('pocketTunnelCustom').addEventListener('click', () => {
        const value = window.prompt('输入固定的公网访问密码（8–64 位英文字母或数字）')
        if (value === null) return
        void pocketAction({ kind: 'setPublicPassword', value: value.trim() })
      })
      document.getElementById('pocketTunnelToken').addEventListener('change', (event) => {
        void pocketAction({ kind: 'setTunnelToken', value: event.target.value.trim() })
      })
      for (const radio of document.querySelectorAll('input[name="pocketTunnelMode"]')) {
        radio.addEventListener('change', () => {
          // Saved, because the mode decides how the next start behaves.
          void save()
        })
      }
      document.getElementById('close').addEventListener('click', () => { void api.close() })
      document.getElementById('restart').addEventListener('click', async () => {
        if (await save()) await api.restart()
      })
    }
  </script>
</body>
</html>
