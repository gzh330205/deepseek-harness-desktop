plugins {
  id 'com.android.application'
}

// The signing identity lives outside the repository (`android/keys/`, gitignored) and is read when it
// is present. Without it a release build still compiles — it is just unsigned, which is what a
// contributor without the key gets.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keys/keystore.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasSigningKey = keystoreProperties.containsKey('storeFile')

// The APK's own version, independent of the desktop shell's: it is shipped as its own release asset
// (P5) and updates on its own schedule.
def pocketVersionName = '1.0.3'
def pocketVersionCode = 4

android {
  namespace 'com.dshdesktop.pocket'
  compileSdk 34

  defaultConfig {
    applicationId 'com.dshdesktop.pocket'
    minSdk 26
    targetSdk 34
    versionCode pocketVersionCode
    versionName pocketVersionName
  }

  signingConfigs {
    if (hasSigningKey) {
      release {
        storeFile rootProject.file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasSigningKey) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    buildConfig true
  }
}

dependencies {
  // The scanner still depends on kotlin-stdlib-jdk7/jdk8 1.6.21, which contain classes that moved into
  // kotlin-stdlib in 1.8 — and appcompat already brings 1.8.22, so the build fails on duplicate
  // classes. Aligning every Kotlin artifact on one version is the documented fix.
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

  implementation 'androidx.appcompat:appcompat:1.7.0'
  // Scanning: a maintained Activity that returns the decoded text, rather than a hand-rolled camera
  // pipeline. Apache-2.0.
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  // The password is optional to remember, and when the user chooses to, it belongs in the keystore
  // rather than in plain SharedPreferences.
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'

  // The address and payload rules are plain Java so they can be tested on the JVM, not only on a
  // device.
  testImplementation 'junit:junit:4.13.2'
}
